# Render Blueprint: backend (Django) + frontend (React static site).
# Базата и фотографиите се на Supabase — овде нема Render база.
# Вредностите со sync:false ги внесуваш во Render при креирање (не се во git).
services:
  - type: web
    name: travel-planner-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py secure_db &&
      python manage.py recompute_badges &&
      python manage.py seed_demo --if-empty &&
      (python manage.py fetch_images || true)
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/v1/cities/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # Supabase → Connect → Session pooler (IPv4), со лозинката на базата
      - key: DATABASE_URL
        sync: false
      # https://<frontend>.onrender.com (без / на крај)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Supabase → Storage → S3 Configuration
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: media
      - key: OPENWEATHER_API_KEY
        sync: false
      # https://<frontend>.onrender.com — за QR-кодот во PDF-от
      - key: FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: none

  - type: web
    name: travel-planner-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # https://<backend>.onrender.com (без / на крај)
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router: секоја патека → index.html
      - type: rewrite
        source: /*
        destination: /index.html
